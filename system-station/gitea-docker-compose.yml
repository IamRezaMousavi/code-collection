## Git hosting

# A source-code-hosting facility (also known as forge)
# is a file archive and web hosting facility
# for source code of software, documentation, web pages,
# and other works, accessible either publicly or privately.
# [wikipedia](https://en.wikipedia.org/wiki/Comparison_of_source-code-hosting_facilities)

# - [Gitea](https://gitea.io/):
#   Git with a cup of tea! Painless self-hosted all-in-one software development service,
#   includes Git hosting, code review, team collaboration, package registry and CI/CD.
#   [github](https://github.com/go-gitea/gitea) `MIT` `Go`
#     - arch: `gitea`

networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=db:3306
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db

  db:
    image: docker.io/library/mysql:8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=gitea
      - MYSQL_USER=gitea
      - MYSQL_PASSWORD=gitea
      - MYSQL_DATABASE=gitea
    networks:
      - gitea
    volumes:
      - ./mysql:/var/lib/mysql